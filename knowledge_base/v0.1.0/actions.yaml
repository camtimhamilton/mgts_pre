actions:
  - id: A01
    name: Согласовать регулярные встречи с наставником
    targets: [R01]
    description: Согласовать доступные каналы помощи и регулярные встречи; сценарное снижение возможно только при подтверждённом устранении недостатка помощи.
    responsible: [mentor, hr]
    completion_criteria: [График встреч согласован, Встречи проводятся]
    resolution_criteria: [Стажёр подтверждает что необходимая помощь доступна своевременно]
    status: demo
  - id: A02
    name: Согласовать регулярную обратную связь и критерии результата
    targets: [R02]
    description: Определить формат обсуждения результатов и конкретные критерии улучшения.
    responsible: [mentor]
    completion_criteria: [Формат и периодичность согласованы, Проведено обсуждение результатов]
    resolution_criteria: [Стажёр подтверждает что получает понятную обратную связь о работе]
    status: demo
  - id: A03
    name: Уточнить задачи и критерии готовности
    targets: [R03]
    description: Совместно записать ожидаемый результат текущей задачи и её приоритет.
    responsible: [mentor]
    completion_criteria: [Задачи и приоритеты записаны, Критерии готовности согласованы]
    resolution_criteria: [Стажёр своими словами подтверждает понимание ожидаемого результата]
    status: demo
  - id: A04
    name: Сверить нагрузку и план обучения
    targets: [R04]
    description: Обсудить доступное рабочее время и перераспределить объём задач либо назначить учебные задачи.
    responsible: [mentor, hr]
    completion_criteria: [Нагрузка обсуждена, Согласован выполнимый план задач или обучения]
    resolution_criteria: [Стажёр подтверждает соответствие нагрузки доступному времени и учебному плану]
    status: demo
  - id: A05
    name: Согласовать план профессионального развития
    targets: [R05]
    description: Выбрать доступные обучающие задачи и способ получения помощи при их освоении.
    responsible: [mentor]
    completion_criteria: [План развития согласован, Доступ к обучающим задачам предоставлен]
    resolution_criteria: [Стажёр подтверждает получение нового опыта по согласованному плану]
    status: demo
  - id: A06
    name: Сверить ожидания и содержание программы
    targets: [R06]
    description: Сопоставить ранее согласованные условия и фактическую программу; объяснить и согласовать корректировку.
    responsible: [hr, mentor]
    completion_criteria: [Конкретное расхождение обсуждено, План корректировки согласован]
    resolution_criteria: [Стажёр подтверждает что заявленное расхождение устранено или условия явно пересогласованы]
    status: demo
  - id: A07
    name: Организовать рабочие контакты с командой
    targets: [R07]
    description: Назначить доступный контакт и включить стажёра в необходимые рабочие обсуждения.
    responsible: [mentor]
    completion_criteria: [Рабочие контакты представлены, Необходимые обсуждения доступны]
    resolution_criteria: [Стажёр подтверждает возможность необходимого рабочего взаимодействия]
    status: demo
  - id: A08
    name: Устранить ресурсный или процессный блокер
    targets: [R08]
    description: Назначить ответственного и проверить доступность конкретного инструмента или доступа.
    responsible: [mentor, hr]
    completion_criteria: [Ответственный назначен, Доступ или инструмент проверен]
    resolution_criteria: [Стажёр подтверждает что указанный блокер больше не препятствует работе]
    status: demo
  - id: A09
    name: Разъяснить дальнейшие этапы программы
    targets: [R09]
    description: Предоставить подтверждённую информацию о процессе и сроках без обещания трудоустройства.
    responsible: [hr]
    completion_criteria: [Процесс и сроки разъяснены, Доступный контакт для вопросов указан]
    resolution_criteria: [Стажёр подтверждает понятность следующих этапов программы]
    status: demo
  - id: A10
    name: Конфиденциально уточнить сообщение и предложить помощь
    targets: [R10]
    description: Уполномоченный HR конфиденциально уточняет собственное сообщение стажёра; сам контакт не означает устранения намерения и не меняет индекс.
    responsible: [hr]
    completion_criteria: [Предложен конфиденциальный контакт, Позиция стажёра уточнена с соблюдением доступа]
    resolution_criteria: [Сам стажёр явно подтверждает изменение ранее сообщённого намерения; контакт сам по себе недостаточен]
    status: demo
  - id: A11
    name: Назначить резервный контакт для помощи
    targets: [R01]
    description: Согласовать доступного резервного специалиста на время недоступности наставника; эффект пересекается с A01 и не суммируется.
    responsible: [mentor, hr]
    completion_criteria: [Резервный контакт согласован, Стажёр знает как получить помощь]
    resolution_criteria: [Стажёр подтверждает своевременную доступность необходимой помощи]
    status: demo
