<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульс программы</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0f1216">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body class="dash" data-view="hr">
  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/icon.svg" width="22" height="22" alt="" aria-hidden="true" decoding="async">
      <span id="team-name">ПУЛЬС</span>
      <span class="tag" id="view-tag">мониторинг стажировки</span>
    </div>

    <div class="top-mid">
      <label class="month-picker" for="month">
        <span>Месяц</span>
        <select id="month" aria-label="Месяц стажировки"></select>
      </label>
      <span class="muted" id="month-hint"></span>
    </div>

    <div class="top-right">
      <span class="status" id="status" data-state="loading">загрузка…</span>
    </div>
  </header>

  <section class="kpi" id="kpi" aria-label="Общая картина"></section>

  <section class="kpi-extra" id="kpi-extra" aria-label="Аналитика для руководителя">
    <div class="bands" style="display:flex;align-items:center;gap:10px">
      <span class="muted">распределение</span>
      <div class="bands-bar" id="bands-bar"></div>
      <span class="muted" id="bands-legend"></span>
    </div>
    <div class="hypothesis" id="hypothesis"></div>
  </section>

  <main class="layout">
    <aside class="rail">
      <div class="rail-tools">
        <input type="search" id="search" placeholder="Поиск по имени" aria-label="Поиск по имени">
        <div class="segmented" id="sort" role="group" aria-label="Сортировка">
          <button data-sort="urgency" class="active">Срочность</button>
          <button data-sort="risk">Индекс</button>
          <button data-sort="delta">Рост</button>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Фильтр">
          <button data-filter="all" class="active">Все</button>
          <button data-filter="risk">В зоне риска</button>
          <button data-filter="gap">Разрыв</button>
          <button data-filter="missing">Нет анкеты</button>
        </div>
      </div>

      <div class="list" id="list" aria-live="polite"></div>

      <div class="rail-bottom">
        <section class="pulse">
          <h3>Пульс программы</h3>
          <div id="heatmap" class="heatmap"></div>
        </section>
        <section class="causes" id="causes-box">
          <h3>Топ причин</h3>
          <div id="causes"></div>
        </section>
      </div>
    </aside>

    <section class="card" id="card" aria-live="polite">
      <div class="empty" id="empty">
        <div class="empty-icon" aria-hidden="true">◎</div>
        <h2>Выберите человека</h2>
        <p class="muted">Слева — список пар, отсортированный по срочности. Сверху те, с кем надо работать в первую очередь.</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span><span id="foot-team">ПУЛЬС</span> · <span id="source-note" class="muted">данные загружаются</span></span>
    <span class="links">
      <button id="open-log" class="linklike">журнал приёма</button>
      <span class="muted">·</span>
      <a href="/import">импорт из файла</a>
    </span>
  </footer>

  <div class="toast" id="toast" hidden></div>

  <aside class="drawer" id="originals" hidden aria-label="Оригиналы ответов">
    <header>
      <h2>Оригиналы ответов</h2>
      <button class="linklike" data-close="originals">закрыть</button>
    </header>
    <div class="drawer-body" id="originals-body"></div>
  </aside>

  <aside class="drawer" id="log" hidden aria-label="Журнал приёма">
    <header>
      <h2>Журнал приёма</h2>
      <button class="linklike" data-close="log">закрыть</button>
    </header>
    <div class="drawer-body" id="log-body"><p class="muted">загрузка…</p></div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <script type="module" src="/static/dashboard.js"></script>
</body>
</html>
