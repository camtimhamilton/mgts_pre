version: 2.0.0
status: preliminary_project_rules
source: Проектная операционализация вопросов МГТС. Формулировки требуют проверки экспертом.
# A narrow vocabulary of explicit observations. Unmatched comments remain available for review.
rules:
  intern:
    clarity:
      - 'неясн\w* задач'
      - 'не(?: всегда)? понят(?:ен|ны|на|но)\b.{0,45}(?:результат|приоритет|задач)'
      - 'непонятн\w* (?:постановк|приоритет|задач)'
    support:
      - 'не хватает (?:регулярной |своевременной )?(?:обратной связи|поддержки)'
      - '(?:редкая обратная связь|обратной связи (?:вс[её] ещ[её] )?недостаточно)'
    workload:
      - '(?:слишком (?:высокая|большая) (?:нагрузка|загрузка)|не справляюсь с (?:нагрузкой|объ[её]мом))'
      - '(?:сложность|проблема)\s*[—:-]\s*(?:высокая нагрузка|перегрузка)'
      - 'не хватает времени (?:на|для) (?:все|каждую|основные) задач'
    team:
      - 'сложно (?:общаться|взаимодействовать) с (?:командой|коллегами)'
    interest:
      - '(?:неинтересны текущие задачи|задачи (?:мне )?неинтересны)'
    growth:
      - 'не (?:вижу|хватает) возможностей для (?:роста|развития)'
    satisfaction:
      - 'недоволен текущей стажировкой'
  mentor:
    clarity:
      - 'не понимает (?:цель|условия|ожидаемый результат|задачу)'
    quality:
      - 'результат (?:часто |регулярно )?требует (?:существенной |постоянной )?доработки'
    autonomy:
      - '(?:нуждается в постоянной помощи|требуется постоянное сопровождение|самостоятельность снизилась)'
    deadlines:
      - '(?:регулярно нарушает сроки|не укладывается в сроки)'
    initiative:
      - 'включается в работу (?:только|преимущественно) после напоминаний'
    team:
      - '(?:возникают|сохраняются) (?:регулярные )?сложности (?:в коммуникации|с обратной связью)'
restored:
  workload: '(?:нагрузка|загрузка) (?:вернулась|снизилась) (?:до |к )?(?:нормальн|комфортн|приемлем)\w* (?:уровн\w*|объ[её]м\w*)'
positive:
  mentor:
    quality: '(?:стабильно |всегда )?качественно выполняет задач\w*'
    autonomy: '(?:работает самостоятельно|самостоятельно выполняет задач\w*)'
    team: '(?:хорошо|конструктивно) взаимодействует с командой'
    clarity: '(?:хорошо|быстро) понимает задач\w*'
  intern:
    clarity: '(?:задачи (?:стали |теперь )?понятнее|(?:мне )?понятны (?:задачи|условия))'
    support: '(?:получаю достаточно (?:поддержки|обратной связи))'
    workload: '(?:текущая )?(?:нагрузка|загрузка) комфортна'
