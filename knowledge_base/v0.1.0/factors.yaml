factors:
  - id: R01
    name: Поддержка наставника
    definition: Доступность необходимой помощи наставника при выполнении задач.
    boundary: О доступе к помощи; качество оценки результатов относится к R02.
    allowed_roles: [intern, mentor]
  - id: R02
    name: Обратная связь
    definition: Наличие понятной и своевременной оценки результатов работы.
    boundary: О содержании обратной связи; недоступность помощи относится к R01.
    allowed_roles: [intern, mentor]
  - id: R03
    name: Понимание роли и задач
    definition: Понятность ожидаемого результата, приоритетов и критериев готовности.
    boundary: О ясности текущей работы; отсутствие обучения относится к R05.
    allowed_roles: [intern, mentor]
  - id: R04
    name: Рабочая нагрузка
    definition: Соответствие объёма задач доступному времени и согласованному плану обучения.
    boundary: Перегрузка или отсутствие задач; нормальный учебный этап сам по себе не проблема.
    allowed_roles: [intern, mentor]
  - id: R05
    name: Профессиональное развитие
    definition: Доступность обучения, нового опыта и согласованных возможностей развития.
    boundary: О развитии; не выводить отсутствие способностей или профессиональную пригодность.
    allowed_roles: [intern, mentor]
  - id: R06
    name: Соответствие ожиданиям
    definition: Соответствие фактического содержания программы явно заявленным условиям.
    boundary: Требуется названное расхождение между ожидаемым и фактическим; не общее недовольство.
    allowed_roles: [intern, mentor]
  - id: R07
    name: Интеграция в коллектив
    definition: Возможность рабочего взаимодействия с командой и доступа к общим каналам.
    boundary: Организационные условия взаимодействия; не свойства личности или социальный диагноз.
    allowed_roles: [intern, mentor]
  - id: R08
    name: Рабочие ресурсы и процессы
    definition: Доступность инструментов, доступов и процессов для выполнения работы.
    boundary: Конкретные рабочие блокеры; отсутствие помощи наставника относится к R01.
    allowed_roles: [intern, mentor]
  - id: R09
    name: Перспективы сотрудничества
    definition: Понятность следующих этапов программы, сроков и процесса дальнейшего сотрудничества.
    boundary: Не обещание трудоустройства и не вывод об оттоке; досрочное прекращение только R10.
    allowed_roles: [intern, mentor]
  - id: R10
    name: Прямое намерение прекратить стажировку
    definition: Прямое актуальное сообщение самого стажёра о намерении досрочно прекратить программу.
    boundary: Только собственное сообщение стажёра; не гипотеза наставника, низкая оценка, отказ от оффера или плановое окончание.
    allowed_roles: [intern]
