roles:
  mentor:
    technical_fields:
      mentor_id: ID наставника
      intern_id: ID стажера
      department: Подразделение / направление стажировки
      period: Контрольный период
    questions:
    - id: M01_Q
      role: mentor
      header: Понимание задач и ожиданий
      question: Насколько стажер понимает поставленные задачи и ожидаемый результат?
      factor_id: M01
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Часто не понимает задачу и ожидаемый результат даже после пояснений
        3: Понимает типовые задачи; по новым или сложным задачам требуются уточнения
        5: Быстро понимает цель и ожидаемый результат, задает необходимые уточняющие вопросы
    - id: M02_Q
      role: mentor
      header: Качество выполнения задач
      question: Насколько качественно стажер выполняет поставленные задачи?
      factor_id: M02
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Результат регулярно требует существенной доработки
        3: Результат в целом соответствует требованиям, возможны отдельные доработки
        5: Стабильно выполняет задачи качественно, результат требует минимальных корректировок
    - id: M03_Q
      role: mentor
      header: Самостоятельность
      question: Насколько самостоятельно стажер выполняет поставленные задачи?
      factor_id: M03
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Требуется постоянное сопровождение и контроль
        3: Самостоятельно выполняет типовые задачи, обращается за помощью в сложных ситуациях
        5: Самостоятельно организует работу и решает задачи в рамках своей зоны ответственности
    - id: M04_Q
      role: mentor
      header: Соблюдение сроков и организация работы
      question: Насколько стажер соблюдает сроки и организует свою работу?
      factor_id: M04
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Регулярно нарушает сроки или не сообщает о рисках
        3: В основном соблюдает сроки и сообщает о возникающих сложностях
        5: Стабильно соблюдает сроки, заранее обозначает риски и организует свою работу
    - id: M05_Q
      role: mentor
      header: Вовлеченность и инициативность
      question: Насколько стажер вовлечен в работу и проявляет инициативу?
      factor_id: M05
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Включается в работу преимущественно после напоминаний
        3: Вовлечен в поставленные задачи и выполняет необходимый объем работы
        5: Проявляет инициативу, предлагает идеи и дополнительные способы решения задач
    - id: M06_Q
      role: mentor
      header: Взаимодействие с наставником и командой
      question: Насколько эффективно стажер взаимодействует с наставником и командой?
      factor_id: M06
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: Возникают регулярные сложности в коммуникации и работе с обратной связью
        3: Корректно взаимодействует с коллегами и воспринимает обратную связь
        5: Конструктивно взаимодействует с командой и использует обратную связь в работе
    - id: MENTOR_T1
      role: mentor
      header: Комментарий о работе за период
      question: 'Опишите, как стажер проявил себя за последний период: что получилось хорошо и с какими сложностями
        он столкнулся?'
      type: text
    - id: MENTOR_T2
      role: mentor
      header: Сложности / ситуации для внимания
      question: Есть ли сложности или ситуации, на которые, по вашему мнению, стоит обратить внимание? Если да,
        кратко опишите.
      type: text
  intern:
    technical_fields:
      intern_id: ID стажера
      department: Подразделение / направление стажировки
      period: Контрольный период
    questions:
    - id: S01_Q
      role: intern
      header: Понятность задач
      question: Мне понятно, каких результатов от меня ожидают по текущим задачам.
      factor_id: S01
      type: rating
      scale_min: 1
      scale_max: 5
      direction: higher_is_better
      severity_mapping:
        1: 1
        2: 0.5
        3: 0
        4: 0
        5: 0
      anchors:
        1: совсем не согласен
        2: скорее не согласен
        3: частично согласен / частично не согласен
        4: скорее согласен
        5: полностью согласен
    - id: S02_Q
