period_format: Месяц 1 … Месяц 6
join_key:
- intern_id
- period
mentor_assignment: Из реестра пар или анкеты наставника; конфликты не разрешать догадкой.
scale_mapping_status: expert_draft
external_forms_mapping: Внешние ID вопросов назначаются после создания форм; не выдумывать.
