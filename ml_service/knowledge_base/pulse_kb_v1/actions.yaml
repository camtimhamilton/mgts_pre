- id: N04
  name: Приоритетно предложить конфиденциальную поддержку HR
  condition: critical_flag
  effect: 0
- id: N05
  name: Запросить недостающую анкету или уточнить ответ
  condition: missing_data
  effect: 0
- id: N06
  name: Уточнить ожидания и дальнейшие перспективы программы
  condition: AD_EXPECTATION или AD_FUTURE
  effect: 0
scenario_constraints:
- Мероприятие связывается с конкретным factor_instance_id, а не только с фактором.
- Совместное действие требует подтверждённых связанных факторов обеих ролей в одном наблюдении.
- Если один фактор имеет несколько независимых активных механизмов, полное исключение возможно только при покрытии
  всех механизмов выбранными мероприятиями. Если основание только rating, действие должно содержать явное подтверждение
  условного устранения именно этого фактора; сначала уточнить причину.
- Один экземпляр фактора вычитается максимум один раз. Эффект вычисляется по фактическому вкладу; нулевые рекомендации
  не перекрашивают историю.
- При критическом флаге меры поддержки не закрывают флаг автоматически.
