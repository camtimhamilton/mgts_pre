actions:
- id: P01
  scope: PAIR
  name: Согласовать постановку задач и критерии результата
  responsible:
  - mentor
  - intern
  target_factors:
  - M01
  - S01
  target_rules:
  - M01_CLARITY
  - M01_PRIORITY
  - M01_REWORK
  - S01_CLARITY
  - S01_PRIORITY
  - S01_REWORK
  eligibility: Оба респондента сообщают о проблеме ясности/приоритетов за тот же месяц.
  completion_criteria:
  - Обе стороны согласовали цель, приоритеты, критерии и способ уточнения.
  resolution_criteria:
  - В следующих ответах обе стороны подтверждают ясность задач; переделок из-за постановки нет.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - SOC07
  - SOC24
  status: expert_draft
- id: P02
  scope: PAIR
  name: Ввести регулярные короткие сверки и обратную связь
  responsible:
  - mentor
  - intern
  target_factors:
  - M06
  - S02
  target_rules:
  - M06_COMM
  - M06_FEEDBACK
  - S02_FEEDBACK
  - S02_ACCESS
  - S02_QUALITY
  eligibility: В обеих анкетах подтверждён дефицит рабочей связи или обратной связи.
  completion_criteria:
  - Согласованы периодичность, каналы вопросов и формат конкретной обратной связи.
  resolution_criteria:
  - Обе стороны подтверждают доступность связи и отсутствие прежних блокеров.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - SOC07
  - SOC24
  - INTERN
  - JDR23
  status: expert_draft
- id: P03
  scope: PAIR
  name: Пересогласовать загрузку, приоритеты и сроки
  responsible:
  - mentor
  - intern
  - hr
  target_factors:
  - M04
  - S03
  target_rules:
  - M04_DEADLINE
  - M04_PLAN
  - S03_OVERLOAD
  - S03_PLANNING
  eligibility: В обеих анкетах подтверждена нагрузка или её связь с задержками; не выводить связь из чисел.
  completion_criteria:
  - Составлен список задач, лимиты параллельности и согласованы новые сроки.
  resolution_criteria:
  - Стажёр подтверждает комфортную нагрузку, наставник — отсутствие обусловленных ею задержек.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - JDR23
  status: expert_draft
- id: P04
  scope: PAIR
  name: Настроить постепенное самостоятельное выполнение с доступной помощью
  responsible:
  - mentor
  - intern
  target_factors:
  - M03
  - S02
  target_rules:
  - M03_ROUTINE
  - M03_CONTROL
  - M03_DECLINE
  - S02_ACCESS
  - S02_FEEDBACK
  eligibility: Обе стороны подтверждают связанные затруднения самостоятельности и поддержки; без причинных предположений.
  completion_criteria:
  - Определены типовые задачи, границы самостоятельности и канал помощи.
  resolution_criteria:
  - Наставник подтверждает самостоятельность на типовых задачах; стажёр подтверждает своевременную помощь.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - SOC24
  - JDR23
  - INTERN
  status: expert_draft
- id: P05
  scope: PAIR
  name: Согласовать правила взаимодействия в команде
  responsible:
  - mentor
  - intern
  - team_lead
  target_factors:
  - M06
  - S06
  target_rules:
  - M06_TEAM
  - M06_COMM
  - S06_INTEGRATION
  - S06_COORDINATION
  eligibility: В обеих перспективах подтверждена одна и та же командная проблема; не применять к конфликту с угрозой.
  completion_criteria:
  - Определены контактные лица, каналы и порядок согласования.
  resolution_criteria:
  - Обе стороны подтверждают конструктивное взаимодействие без прежних препятствий.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - SOC07
  - SOC24
  - INTERN
  - ONB24
  status: expert_draft
- id: P06
  scope: PAIR
  name: Согласовать план освоения навыка и практические задания
  responsible:
  - mentor
  - intern
  target_factors:
  - M02
  - S05
  target_rules:
  - M02_ERRORS
  - M02_REWORK
  - M02_ACCEPTANCE
  - S05_LEARNING
  - S05_RESOURCES
  eligibility: Есть явная связь между дефицитом обучения и наблюдаемой трудностью выполнения; не выводить её только
    из низких оценок.
  completion_criteria:
  - Определён конкретный навык, выделены ресурсы, критерии и практика.
  resolution_criteria:
  - Стажёр подтверждает освоение навыка, наставник — улучшение соответствующего результата.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - SOC24
  - ONB24
  - INTERN
  status: expert_draft
- id: P07
  scope: PAIR
  name: Обсудить интересы, содержание задач и ожидаемое участие
  responsible:
  - mentor
  - intern
  target_factors:
  - M05
  - S04
  target_rules:
  - M05_REMINDER
  - M05_PARTICIPATION
  - M05_INITIATIVE
  - S04_CONTENT
  - S04_MONOTONY
  - S04_MISMATCH
  eligibility: Обе стороны описывают связанные трудности интереса и участия; не приписывать скрытую мотивацию.
  completion_criteria:
  - Согласованы содержание задач и реалистичные ожидания участия.
  resolution_criteria:
  - Стажёр подтверждает интерес, наставник — согласованное участие.
  effect_mode: conditional_full_factor_resolution
  source_ids:
  - DESIGN
  - JDR23
  - ONB24
  - INTERN
  status: expert_draft
- id: M_A01
  scope: MENTOR
  name: Уточнить требования и проверять понимание задачи
  responsible:
  - mentor
  target_factors:
  - M01
  target_rules:
  - M01_CLARITY
  - M01_PRIORITY
  - M01_REWORK
  eligibility: Есть активный фактор M01; помощь по новым сложным задачам сама по себе не является проблемой.
  completion_criteria:
  - Для задач определены цель, результат, приоритеты; стажёр пересказывает договорённости.
  resolution_criteria:
  - Наставник подтверждает, что повторные пояснения или переделки по прежней причине больше не нужны.
  effect_mode: conditional_full_factor_resolution
  source_ids:
