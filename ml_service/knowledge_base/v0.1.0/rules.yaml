rules:
  - id: RULE_R01_001
    revision: 1
    factor_id: R01
    name: Недостаточная доступность помощи наставника
    description: Стажёр не получает необходимую помощь или наставник сообщает о своей недоступности для помощи.
    applies_to: [intern, mentor]
    indicators: [Не удаётся получить ответ на рабочий вопрос, Работа затруднена из-за недоступности наставника]
    exclusions: [Единичная задержка без последствий, Гипотетическая или уже устранённая ситуация, Общая оценка без привязки к помощи]
    severity:
      moderate: Явная нехватка помощи при сохранении возможности продолжать работу.
      high: Систематически нет ответов либо отсутствие помощи блокирует выполнение задач.
    action_ids: [A01, A11]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R02_001
    revision: 1
    factor_id: R02
    name: Недостаточная обратная связь о результатах
    description: Нет своевременной понятной оценки выполненной работы или критериев её обсуждения.
    applies_to: [intern, mentor]
    indicators: [Результаты работы не обсуждаются, Обратная связь не объясняет что улучшить]
    exclusions: [Просьба о технической помощи без вопроса об оценке, Гипотетическая или уже устранённая ситуация, Разовая задержка без последствий]
    severity:
      moderate: Обратная связь эпизодическая или недостаточно конкретная; стажёр может продолжать работу.
      high: Обратная связь систематически отсутствует либо из-за неё невозможно понять требуемое улучшение.
    action_ids: [A02]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R03_001
    revision: 1
    factor_id: R03
    name: Неясность роли и ожидаемых результатов
    description: Неясны текущая задача, ожидаемый результат, приоритеты или критерии готовности.
    applies_to: [intern, mentor]
    indicators: [Неясно какого результата ожидают, Приоритеты задач противоречат друг другу]
    exclusions: [Недостаток обучения без неясности задачи, Гипотетическая или уже устранённая ситуация, Нормальное уточнение новой задачи без затруднения]
    severity:
      moderate: Часть ожиданий или приоритетов неясна; работа продолжается с затруднениями.
      high: Неясность систематическая либо мешает приступить к работе или завершить задачу.
    action_ids: [A03]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R04_001
    revision: 1
    factor_id: R04
    name: Несогласованная рабочая нагрузка
    description: Явно сообщается о перегрузке либо отсутствии задач вне согласованного учебного этапа.
    applies_to: [intern, mentor]
    indicators: [Объём задач не помещается в рабочее время, Нет задач и понятного учебного плана]
    exclusions: [Плановое обучение с подтверждённым планом, Гипотетическая или уже устранённая ситуация, Единичный пик без последствий]
    severity:
      moderate: Нагрузка периодически затрудняет работу либо часть времени нет согласованных задач.
      high: Перегрузка систематически препятствует выполнению задач либо задач длительно нет и обучение не организовано.
    action_ids: [A04]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R05_001
    revision: 1
    factor_id: R05
    name: Недостаток профессионального развития
    description: Стажёр не получает обещанных возможностей освоения рабочих навыков или нового опыта.
    applies_to: [intern, mentor]
    indicators: [Задачи не дают нового опыта, Нет доступа к согласованному обучению]
    exclusions: [Краткий вводный этап с действующим планом обучения, Гипотетическая или уже устранённая ситуация, Вывод о способностях стажёра]
    severity:
      moderate: Отдельные согласованные возможности развития недоступны либо план развития неполон.
      high: Обучение и новый опыт систематически отсутствуют вопреки согласованному плану.
    action_ids: [A05]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R06_001
    revision: 1
    factor_id: R06
    name: Расхождение заявленного и фактического содержания программы
    description: Названы конкретные ожидаемые условия и отличающаяся от них фактическая ситуация.
    applies_to: [intern, mentor]
    indicators: [Фактические задачи отличаются от заявленных, Согласованное содержание программы не соблюдается]
    exclusions: [Необоснованная догадка об ожиданиях, Общее недовольство без сравнения, Гипотетическая или уже устранённая ситуация]
    severity:
      moderate: Есть конкретное частичное расхождение с согласованными условиями.
      high: Существенное или систематическое расхождение препятствует участию в согласованной программе.
    action_ids: [A06]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R07_001
    revision: 1
    factor_id: R07
    name: Организационные препятствия взаимодействию с командой
    description: Нет доступной возможности рабочего общения с командой или участия в нужных обсуждениях.
    applies_to: [intern, mentor]
    indicators: [Не включают в необходимые рабочие обсуждения, Нет понятного контакта для взаимодействия с командой]
    exclusions: [Предположения о личности или чувствительных признаках, Предпочтение самостоятельной работы без препятствий, Гипотетическая или уже устранённая ситуация]
    severity:
      moderate: Часть необходимых рабочих контактов или обсуждений недоступна.
      high: Систематическое отсутствие взаимодействия с командой блокирует работу или участие в программе.
    action_ids: [A07]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R08_001
    revision: 1
    factor_id: R08
    name: Недоступность рабочих ресурсов или блокирующий процесс
    description: Конкретный отсутствующий доступ, инструмент или процесс затрудняет выполнение задачи.
    applies_to: [intern, mentor]
    indicators: [Нет необходимого рабочего доступа, Недоступный инструмент или согласование блокирует задачу]
    exclusions: [Отсутствие помощи наставника без ресурсного блокера, Гипотетическая или уже устранённая ситуация, Необязательный инструмент без влияния на работу]
    severity:
      moderate: Ресурсный или процессный недостаток затрудняет работу при наличии обходного пути.
      high: Необходимый доступ или инструмент отсутствует и выполнение задачи заблокировано.
    action_ids: [A08]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R09_001
    revision: 1
    factor_id: R09
    name: Неясность дальнейших этапов сотрудничества
    description: Не разъяснены процесс, сроки или условия следующих этапов программы.
    applies_to: [intern, mentor]
    indicators: [Неизвестны сроки решения о следующих этапах, Нет информации о процессе дальнейшего сотрудничества]
    exclusions: [Отсутствие обещания трудоустройства само по себе, Прямое досрочное прекращение относится к R10, Гипотетическая или уже устранённая ситуация]
    severity:
      moderate: Неясны отдельные сроки или условия следующего этапа.
      high: Неясность существенна и систематична либо необходимая информация отсутствует перед наступающим решением.
    action_ids: [A09]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
  - id: RULE_R10_001
    revision: 1
    factor_id: R10
    name: Прямое сообщение о досрочном прекращении программы
    description: Только собственное прямое актуальное сообщение стажёра о намерении закончить стажировку до предусмотренного срока; требуется конфиденциальное уточнение и подтверждение.
    applies_to: [intern]
    indicators: [Прямо сообщает что намерен досрочно прекратить текущую стажировку]
    exclusions: [Предположение наставника, Косвенное недовольство или низкая оценка, Плановое окончание программы или отказ от оффера, Гипотетическая или уже устранённая ситуация, Неоднозначная формулировка]
    severity:
      moderate: Не начислять; неоднозначная или неполная формулировка требует review и не считается прямым намерением.
      high: Прямое текущее сообщение самого стажёра о досрочном прекращении; до независимого или человеческого подтверждения pending_review без начисления.
    action_ids: [A10]
    source_refs: [{source_id: DEMO_AUTHOR_001, relationship: author_demo}]
    status: demo
