flags:
- id: CF_EXIT
  name: Сообщение о намерении досрочно прекратить программу
  roles:
  - mentor
  - intern
  activation: Прямое актуальное сообщение стажёра о намерении или серьёзном рассмотрении досрочного прекращения
    программы; пересказ наставником помечается third_party и требует уточнения.
  exclusions:
  - Плановое завершение М6
  - гипотетическая ситуация
  - слухи
  - неясная фраза без срока
  priority: human_review
  numeric_contribution: 0
  source_ids:
  - DESIGN
  action_id: N04
- id: CF_SAFETY
  name: Сообщение об угрозе, насилии или серьёзном небезопасном взаимодействии
  roles:
  - mentor
  - intern
  activation: Прямое сообщение о конкретном актуальном небезопасном инциденте или угрозе; не устанавливать истинность
    обвинения автоматически.
  exclusions:
  - обычное рабочее несогласие
  - метафора
  - гипотеза
  priority: human_review
  numeric_contribution: 0
  source_ids:
  - DESIGN
  action_id: N04
- id: CF_BLOCKED
  name: Работа фактически заблокирована
  roles:
  - mentor
  - intern
  activation: Прямо описана существенная текущая невозможность выполнять согласованные задачи из-за рабочего препятствия,
    требующего вмешательства.
  exclusions:
  - краткая штатная консультация
  - плановая учебная пауза
  - уже устранено
  priority: human_review
  numeric_contribution: 0
  source_ids:
  - DESIGN
  action_id: N04
additional_signals:
- id: AD_RESOURCE
  definition: Отсутствует нужный доступ, инструмент, оборудование; фактор начислять только при отдельно подтверждённом
    проявлении.
- id: AD_EXPECTATION
  definition: Явное несовпадение согласованных условий и опыта без общей оценки.
- id: AD_FUTURE
  definition: Неясность дальнейших перспектив или трудоустройства.
- id: AD_LOAD
  definition: Наставник сообщает о нагрузке без подтверждённого проявления одного из M-факторов.
- id: AD_OTHER
  definition: Другая значимая тема вне таксономии; не начислять баллы, направить на ревью.
note: Флаги и дополнительные сигналы имеют нулевой самостоятельный численный вклад, не создают третий скоринг; допустимо
  одновременно подтвердить основной фактор при отдельных основаниях.
